name: CI

# Single-pipeline, strict order:
#   1. build-catalog   — create the catalog from upstream sources.
#   2. test, package   — use the catalog (tests + wheel build).
#   3. publish-data    — publish data-latest (+ data-v<ver> on release).
#   4. validate-release — consume the published data.
#
# Static-site build and Pages deployment moved to the simdref-web repo,
# which consumes `simdref export`'s JSON output.
#
# Every edge is expressed via `needs:`. Nothing fires out of order or
# on missing state; a red step breaks the whole chain deterministically.

on:
  pull_request:
  push:
    branches-ignore:
      - gh-pages
  release:
    types:
      - published
  schedule:
    - cron: "0 0 * * 1" # weekly (Mon 00:00 UTC) — refresh data-latest from upstream
  workflow_dispatch:
    inputs:
      publish_versioned:
        type: boolean
        default: false
        description: "Also publish data-v<pyproject-version> (used to bootstrap a versioned data release when release.yml's tag push did not cascade)."
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────────────────────────
  # Phase 1 — data creation
  # ───────────────────────────────────────────────────────────────────
  build-catalog:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
    outputs:
      data_tag: ${{ steps.meta.outputs.data_tag }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          activate-environment: true
          python-version: "3.14"

      # No catalog cache: every run rebuilds from current upstream
      # sources. Trades ~10 min of runtime for guaranteed freshness and
      # zero chance of a stale cache masking a schema or ingestion
      # regression.
      - name: Install LLVM toolchain
        # Version 22 is the current stable line on apt.llvm.org
        # (llvm-toolchain-noble-22). The previous "23 == nightly/trunk"
        # mapping broke: trunk moved to 24 and clang-23 has no installation
        # candidate, failing the job with apt exit 100.
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 22
          echo "/usr/lib/llvm-22/bin" >> "$GITHUB_PATH"

      - name: Install package
        run: uv pip install -e .

      - name: Vendor RISC-V sources
        run: |
          git clone --depth 1 https://github.com/riscv/riscv-unified-db /tmp/riscv-unified-db
          git clone --depth 1 https://github.com/riscv-non-isa/riscv-rvv-intrinsic-doc /tmp/riscv-rvv-intrinsic-doc
          python tools/vendor_riscv_sources.py

      - name: Build catalog
        run: python -u -m simdref build

      - name: Validate upstream ingestion
        run: python tools/validate_sources.py --require-sdm

      - name: Assert catalog carries measured + modeled perf rows
        run: |
          python - <<'PY'
          import msgpack
          from pathlib import Path
          data = msgpack.unpackb(Path("data/derived/catalog.msgpack").read_bytes(), raw=False)
          instructions = data.get("instructions") or []
          measured = modeled = 0
          for inst in instructions:
              for entry in (inst.get("arch_details") or {}).values():
                  if isinstance(entry, dict):
                      if entry.get("source_kind") == "modeled":
                          modeled += 1
                      else:
                          measured += 1
          print(f"measured arch_details rows: {measured}")
          print(f"modeled  arch_details rows: {modeled}")
          assert measured >= 1000, f"too few measured rows: {measured}"
          assert modeled >= 1000, f"too few modeled rows: {modeled}"
          PY

      - name: Compute data tag
        id: meta
        run: |
          # Read straight from pyproject.toml (the single source of truth) so
          # the data tag never depends on the editable install's metadata being
          # freshly rebuilt after a version bump.
          VERSION=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "data_tag=data-v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Package perf cache
        run: |
          if [ -d vendor/perf-cache ]; then
            tar --zstd -cf perf-cache.tar.zst -C vendor perf-cache
          else
            : > perf-cache.tar.zst
          fi

      - name: Package web-data export
        # web/ is simdref export's JSON output (schema_version + search
        # indices). Zipped because a GitHub release asset must be one file.
        run: cd web && zip -qr ../web-data.zip .

      - name: Upload catalog artifact
        uses: actions/upload-artifact@v7
        with:
          name: catalog
          path: |
            data/derived/catalog.msgpack
            data/derived/catalog.db
            perf-cache.tar.zst
            web-data.zip
            web

  # ───────────────────────────────────────────────────────────────────
  # Phase 2 — data usage
  # ───────────────────────────────────────────────────────────────────
  test:
    needs: build-catalog
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Every non-EOL CPython. The interior versions are not redundant: 3.11 alone
      # left `build_sqlite` publishing a header-only database, which a floor-and-
      # ceiling matrix would have missed.
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    name: test (py${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          activate-environment: true
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: uv pip install -e . pytest 'tomli; python_version < "3.11"'

      # actions/upload-artifact preserves path structure when multiple
      # paths are listed, so catalog.msgpack / catalog.db land back at
      # data/derived/ automatically — no manual move needed.
      - name: Restore catalog artifact
        uses: actions/download-artifact@v8
        with:
          name: catalog
          path: .

      - name: Verify restored catalog schema
        run: python -c "from simdref.storage import sqlite_schema_is_current; assert sqlite_schema_is_current(), 'schema mismatch after artifact restore'"

      - name: Run Python test suite
        run: python -m pytest tests

      - name: Check Python syntax
        run: python -m py_compile src/simdref/cli.py src/simdref/display.py src/simdref/ingest.py src/simdref/pdfparse/base.py src/simdref/pdfparse/intel.py src/simdref/tui.py

      - name: Runtime smoke — inspect catalog
        run: simdref doctor

      - name: Runtime smoke — structural assertions
        env:
          EXPECTED_INTRINSICS_MIN: "7000"
          EXPECTED_INSTRUCTIONS_MIN: "20000"
        run: |
          python - <<'PY'
          import os, json
          from simdref.storage import SQLITE_PATH, WEB_DIR, open_db, sqlite_schema_is_current

          assert sqlite_schema_is_current(), "SQLite schema is not current"
          with open_db(SQLITE_PATH) as conn:
              intrinsics = conn.execute("select count(*) from intrinsics_data").fetchone()[0]
              instructions = conn.execute("select count(*) from instructions_data").fetchone()[0]
          assert intrinsics > int(os.environ["EXPECTED_INTRINSICS_MIN"]), intrinsics
          assert instructions > int(os.environ["EXPECTED_INSTRUCTIONS_MIN"]), instructions

          meta_path = WEB_DIR / "search-index-meta.json"
          instructions_path = WEB_DIR / "search-index-instructions.json"
          intrinsics_path = WEB_DIR / "search-index-intrinsics.json"
          intrinsic_chunks = WEB_DIR / "intrinsic-chunks"
          for required in (meta_path, instructions_path, intrinsics_path):
              assert required.exists(), f"missing {required}"
          assert not (WEB_DIR / "search-index.json").exists(), \
              "legacy monolithic search-index.json must not be emitted"
          assert intrinsic_chunks.is_dir(), f"missing {intrinsic_chunks}"
          chunk_files = sorted(intrinsic_chunks.glob("*.json"))
          assert chunk_files, f"no chunk files under {intrinsic_chunks}"
          chunked_names = set()
          for p in chunk_files:
              chunked_names.update(json.loads(p.read_text()).keys())
          assert chunked_names, "intrinsic chunks contained no names"
          assert len(chunked_names) <= intrinsics

          meta = json.loads(meta_path.read_text())
          assert "isa_config" in meta
          assert meta.get("available_isas"), "meta.available_isas is empty"
          # search-index-*.json are columnar (see simdref.export._columnar_*):
          # {"n": <row count>, "cols": {...}, ...}, not a plain list of rows.
          intr_payload = json.loads(intrinsics_path.read_text())
          inst_payload = json.loads(instructions_path.read_text())
          assert intr_payload["n"] == intrinsics
          assert inst_payload["n"] == instructions
          PY

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          activate-environment: true
          python-version: "3.14"

      - name: Build distributables
        run: uv build

      - name: Check distribution metadata
        run: |
          uv pip install twine
          twine check dist/*

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheel
          path: dist/

  # ───────────────────────────────────────────────────────────────────
  # Phase 3 — deploy (only on push-to-main, release, or manual dispatch)
  # Skipped entirely for pull_request and reusable workflow_call.
  # ───────────────────────────────────────────────────────────────────
  publish-data:
    needs: [build-catalog, test, package]
    # Phase 3 only runs when ci.yml is the top-level workflow — i.e.,
    # not when invoked via workflow_call from release-candidate.yml.
    # github.workflow reflects the top-level caller's name.
    if: >-
      github.workflow == 'CI'
      && (
        github.event_name == 'release'
        || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        || github.event_name == 'schedule'
        || github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: catalog
          path: .

      - name: Publish data-latest
        uses: softprops/action-gh-release@v3
        with:
          tag_name: data-latest
          name: Latest Data Build
          prerelease: true
          files: |
            data/derived/catalog.msgpack
            data/derived/catalog.db
            perf-cache.tar.zst
            web-data.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish data-v<version>
        if: github.event_name == 'release' || inputs.publish_versioned == true
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build-catalog.outputs.data_tag }}
          name: Data Build ${{ needs.build-catalog.outputs.data_tag }}
          prerelease: ${{ github.event.release.prerelease || false }}
          files: |
            data/derived/catalog.msgpack
            data/derived/catalog.db
            perf-cache.tar.zst
            web-data.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  testpypi:
    # Publish the commit CI just tested to TestPyPI as a dev build. The
    # default checkout of a push run is the pushed commit, and `needs:`
    # matrix green. Versions order by committer time, not publish time, so
    # out-of-order completion never makes an older commit the newest dev.
    needs: [test, package]
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && github.repository == 'simd-labs/simdref'
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # PyPI OIDC trusted publishing
      contents: read
    environment:
      name: testpypi
      url: https://test.pypi.org/p/simdref
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          activate-environment: true
          python-version: "3.12"

      - name: Compute dev stamp
        id: stamp
        # PEP 440 only accepts a single non-negative integer after `.dev`,
        # so we concatenate the tested commit's UTC committer minute with
        # the zero-padded run number: versions then order by commit order,
        # not by which push happened to finish its tests first. Squash
        # merges set committer time at merge.
        run: |
          ts="$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y%m%d%H%M HEAD)"
          # ponytail: order follows committer time; a skewed clock or
          # force-push can misorder dev builds.
          run_padded="$(printf '%05d' "${GITHUB_RUN_NUMBER}")"
          stamp="${ts}${run_padded}"
          echo "value=${stamp}" >> "$GITHUB_OUTPUT"
          echo "dev stamp: ${stamp}"

      - name: Stamp dev version
        env:
          STAMP: ${{ steps.stamp.outputs.value }}
        run: |
          python - <<PY
          import os, pathlib, re
          stamp = os.environ["STAMP"]
          # PEP 440 wants one non-negative integer after .dev; the run
          # number is unique per workflow (per repo), so rerun-safe with
          # skip-existing below.
          DEV_SUFFIX_RE = re.compile(r'(?:[-.]dev\d*)+$')
          pyproject = pathlib.Path("pyproject.toml")
          text = pyproject.read_text()
          new_text, n = re.subn(
              r'^version = "([^"]+)"',
              lambda m: f'version = "{DEV_SUFFIX_RE.sub("", m.group(1))}.dev{stamp}"',
              text,
              count=1,
              flags=re.M,
          )
          if n != 1:
              raise SystemExit("failed to stamp version in pyproject.toml")
          pyproject.write_text(new_text)
          PY

      - name: Build wheel and sdist
        run: uv build

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  validate-release:
    needs: publish-data
    if: >-
      github.workflow == 'CI'
      && (
        github.event_name == 'release'
        || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        || github.event_name == 'schedule'
        || github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          activate-environment: true
          python-version: "3.14"

      - name: Install package and test dependencies
        run: uv pip install -e . pytest

      - name: Pull freshly-published data-latest
        run: simdref update --from-release

      - name: Full test suite against released catalog
        run: python -m pytest tests

      - name: Sanity-run the CLI
        run: |
          simdref --version
          simdref doctor
          simdref llm query paddd
          simdref annotate --help
